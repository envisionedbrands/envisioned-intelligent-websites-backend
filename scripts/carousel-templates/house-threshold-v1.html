<!doctype html>
<html lang="en" data-carousel-contract="{{contract_version}}" data-template-id="{{template_id}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1350">
<style>
{{font_faces}}
:root{--font-display:"Studio Inter",sans-serif;--font-body:"Studio Inter",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{background:#0f0c0a;color:#f4e8d6;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
.slide{position:relative;width:1080px;height:1350px;padding:78px 82px 70px;background:#0f0c0a;overflow:hidden;display:flex;flex-direction:column}
.slide:before{content:"";position:absolute;width:520px;height:520px;border:2px solid rgba(232,106,44,.65);border-radius:50%;right:-270px;top:180px}
.slide:after{content:"";position:absolute;width:12px;height:12px;background:#e86a2c;border-radius:50%;left:82px;top:170px}
.header,.slide-content,.footer{position:relative;z-index:1}
.header{display:flex;justify-content:space-between;font-size:15px;letter-spacing:.12em;text-transform:lowercase;color:#c9bfa8}
.header strong{font-weight:500;color:#f4e8d6}
.slide-content{margin:auto 0;max-width:850px}
.slide-heading{margin:0;font-family:var(--font-display);font-size:82px;line-height:1.08;letter-spacing:-.035em;font-weight:400}
.slide-paragraph{max-width:760px;margin:34px 0 0;font-size:34px;line-height:1.45;font-weight:400;text-transform:lowercase;color:inherit}
.slide-list{margin:36px 0 0;padding:0;list-style:none;max-width:820px}
.slide-list li{position:relative;margin:22px 0;padding-left:44px;font-size:30px;line-height:1.4;text-transform:lowercase}
.slide-heading,.slide-paragraph,.slide-list,.slide-list li{min-width:0;white-space:normal;overflow-wrap:anywhere;word-break:normal}
.slide-list li:before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;background:#e86a2c;border-radius:50%}
.footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:#c9bfa8;font-size:15px;letter-spacing:.1em;text-transform:lowercase}
.dots{display:flex;gap:10px}
.dots i{display:block;width:9px;height:9px;border:1px solid #e86a2c;border-radius:50%}
.dots i:first-child{background:#e86a2c}
.layout-cover .slide-heading{font-size:96px;max-width:820px}
.layout-cover .slide-paragraph{font-size:30px}
.layout-cover:before{width:900px;height:280px;right:-80px;top:auto;bottom:150px;border-width:3px;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(-8deg)}
.layout-questions{background:#e5ddd1;color:#1a1612}
.layout-questions:before{display:none}
.layout-questions:after{left:50%;top:220px}
.layout-questions .header,.layout-questions .footer{color:#5a5149}
.layout-questions .header strong{color:#1a1612}
.layout-questions .slide-content{text-align:center;max-width:900px}
.layout-questions .slide-heading{font-size:60px}
.layout-questions .slide-list{margin-left:auto;margin-right:auto;text-align:left}
.layout-questions .slide-list li{padding:18px 32px 18px 58px;border-top:1px solid #d6ccb8;font-size:27px}
.layout-questions .slide-list li:nth-child(even):before{background:#1a1612}
.layout-body .slide-content{margin-top:190px}
.layout-body .slide-heading{font-size:58px}
.layout-body .slide-paragraph{font-size:36px}
.layout-photo{background:#17100d}
.layout-photo:before{inset:0;width:auto;height:auto;border:0;border-radius:0;background-color:#17100d;background-image:url("{{photo_asset_1}}");background-size:cover;background-position:center;filter:saturate(.72) brightness(.72)}
.layout-photo[data-slide="05"]:before{background-image:url("{{photo_asset_2}}")}
.layout-photo[data-slide="09"]:before{background-image:url("{{photo_asset_3}}")}
.layout-photo:after{left:auto;right:82px;top:90px}
.layout-photo .slide-content{margin-top:auto;margin-bottom:90px;max-width:430px;padding:24px;background:rgba(15,12,10,.55)}
.layout-photo[data-slide="05"] .slide-content,.layout-photo[data-slide="09"] .slide-content{margin-left:auto}
.layout-photo .slide-heading{font-size:46px}
.layout-photo .slide-paragraph{font-size:25px}
.layout-diagram{background:#e5ddd1;color:#1a1612}
.layout-diagram:before{width:690px;height:460px;right:110px;top:410px;border:3px solid #e86a2c;border-left-color:transparent;border-bottom-color:transparent;transform:rotate(18deg)}
.layout-diagram .header,.layout-diagram .footer{color:#5a5149}
.layout-diagram .header strong{color:#1a1612}
.layout-diagram .slide-heading{font-size:58px}
.layout-diagram .slide-list{display:grid;grid-template-columns:1fr 1fr;gap:48px 90px}
.layout-diagram .slide-list li{padding:0 0 20px 34px;border-bottom:1px solid #d6ccb8;font-size:24px}
.layout-closer_visual{background:#e5ddd1;color:#1a1612}
.layout-closer_visual:before{width:670px;height:120px;right:195px;top:560px;border:0;border-radius:0;background:radial-gradient(circle at 5% 50%,transparent 0 35px,#5a5149 36px 38px,transparent 39px),radial-gradient(circle at 28% 50%,transparent 0 35px,#5a5149 36px 38px,transparent 39px),radial-gradient(circle at 51% 50%,transparent 0 35px,#5a5149 36px 38px,transparent 39px),radial-gradient(circle at 74% 50%,transparent 0 35px,#5a5149 36px 38px,transparent 39px),radial-gradient(circle at 97% 50%,#e86a2c 0 37px,transparent 38px)}
.layout-closer_visual:after{display:none}
.layout-closer_visual .header,.layout-closer_visual .footer{color:#5a5149}
.layout-closer_visual .header strong{color:#1a1612}
.layout-closer_visual .slide-content{text-align:center;max-width:760px;margin-top:210px}
.layout-closer_visual .slide-heading{font-size:60px}
.layout-closer_visual .slide-paragraph{font-size:28px}
.layout-closer{background:#0f0c0a}
.layout-closer:before{inset:0;width:auto;height:auto;right:0;top:0;border:0;border-radius:0;background-color:#0f0c0a;background-image:url("{{photo_asset_4}}");background-size:cover;background-position:center;filter:saturate(.72) brightness(.45)}
.layout-closer .slide-content{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;max-width:none;align-items:end}
.layout-closer .slide-heading{grid-column:1/-1;font-size:84px}
.layout-closer .slide-paragraph{font-size:27px}
.layout-closer .dots i{width:14px;height:14px}

</style>
</head>
<body>
<main class="slide layout-{{slide_layout}}" data-layout="{{slide_layout}}" data-slide="{{slide_number}}">
  <header class="header"><strong>threshold notes</strong><span>house · quiet practice</span></header>
  <section class="slide-content">{{slide_content}}</section>
  <footer class="footer"><span>{{slide_number}} / {{slide_total}}</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></footer>
</main>
<div class="studio-asset-preloads" aria-hidden="true" style="position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;opacity:.001;pointer-events:none">{{asset_preloads}}</div>
</body>
</html>
