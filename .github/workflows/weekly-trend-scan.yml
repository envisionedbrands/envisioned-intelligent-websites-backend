name: Weekly Trend Scan

on:
  schedule:
    # Mondays 06:00 UTC — proposes new topic ideas into the calendar as PLANNED.
    # Nothing is written or published; ideas wait for manual approval on the board.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run trend scan
        env:
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          TIMESTAMP="$(date +%s)"
          BODY='{"max_new_entries":5}'
          SIGNING_INPUT="POST:/api/trend-scan:${TIMESTAMP}:${BODY}"
          SIGNATURE="$(printf "%s" "${SIGNING_INPUT}" | openssl dgst -sha256 -hmac "${API_SECRET_KEY}" -hex | awk '{print $2}')"

          curl --fail-with-body -sS \
            -X POST "${BACKEND_URL}/api/trend-scan" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${API_SECRET_KEY}" \
            -H "x-timestamp: ${TIMESTAMP}" \
            -H "x-signature: ${SIGNATURE}" \
            --max-time 480 \
            -d "${BODY}"
