name: Weekly Trend Scan

on:
  schedule:
    # Mondays 06:00 UTC — proposes new topic ideas into the calendar as PLANNED.
    # Nothing is written or published; ideas wait for manual approval on the board.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Google News headlines and run trend scan
        env:
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          # Google News RSS blocks Cloudflare Worker IPs, so the feeds are fetched
          # HERE on the GitHub runner and posted to the backend as body.items.
          # Edit this list to change what gets scanned (one query per line).
          SCAN_DOMAINS: |
            AI for small business owners
            AI for coaches and consultants
            founder productivity systems
            personal brand strategy
            creator economy AI
        run: |
          python3 - <<'PY' > /tmp/items.json
          import json, os, re, urllib.request, urllib.parse

          def fetch(query):
              params = urllib.parse.urlencode({
                  "q": f"{query} when:7d", "hl": "en-US", "gl": "US", "ceid": "US:en",
              })
              url = f"https://news.google.com/rss/search?{params}"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  xml = r.read().decode("utf-8", "replace")
              items = []
              for block in re.findall(r"<item>([\s\S]*?)</item>", xml)[:5]:
                  def pick(tag):
                      m = re.search(rf"<{tag}>([\s\S]*?)</{tag}>", block)
                      v = m.group(1) if m else ""
                      v = re.sub(r"<!\[CDATA\[([\s\S]*?)\]\]>", r"\1", v)
                      v = re.sub(r"<[^>]+>", " ", v)
                      return re.sub(r"\s+", " ", v).strip()
                  items.append({
                      "title": pick("title"), "link": pick("link"),
                      "description": pick("description"), "publishedAt": pick("pubDate"),
                      "domain": query, "query": query,
                  })
              return items

          all_items = []
          for q in [d.strip() for d in os.environ["SCAN_DOMAINS"].splitlines() if d.strip()]:
              try:
                  all_items.extend(fetch(q))
              except Exception as e:
                  print(f"::warning::feed failed for '{q}': {e}")
          json.dump({"max_new_entries": 5, "items": all_items}, open("/dev/stdout", "w"))
          PY

          COUNT=$(python3 -c "import json;print(len(json.load(open('/tmp/items.json'))['items']))")
          echo "Fetched ${COUNT} headlines"
          if [ "$COUNT" = "0" ]; then echo "No headlines fetched — skipping scan"; exit 1; fi

          TIMESTAMP="$(date +%s)"
          BODY="$(cat /tmp/items.json)"
          SIGNING_INPUT="POST:/api/trend-scan:${TIMESTAMP}:${BODY}"
          SIGNATURE="$(printf "%s" "${SIGNING_INPUT}" | openssl dgst -sha256 -hmac "${API_SECRET_KEY}" -hex | awk '{print $2}')"

          curl --fail-with-body -sS \
            -X POST "${BACKEND_URL}/api/trend-scan" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${API_SECRET_KEY}" \
            -H "x-timestamp: ${TIMESTAMP}" \
            -H "x-signature: ${SIGNATURE}" \
            --max-time 480 \
            --data-binary @/tmp/items.json
