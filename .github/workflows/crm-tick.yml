name: CRM Engine Tick

on:
  schedule:
    # Every 10 minutes — processes due workflow enrollments (waits, sends, tags).
    # GitHub cron is best-effort; the engine is idempotent so drift is harmless.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run CRM engine tick
        env:
          # Repo secret: the same API_SECRET_KEY as your backend .env / wrangler secret
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          # Repo variable: your deployed BACKEND worker URL, e.g. https://your-backend.workers.dev
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          TIMESTAMP="$(date +%s)"
          BODY="{}"
          SIGNING_INPUT="POST:/api/crm/tick:${TIMESTAMP}:${BODY}"
          SIGNATURE="$(printf "%s" "${SIGNING_INPUT}" | openssl dgst -sha256 -hmac "${API_SECRET_KEY}" -hex | awk '{print $2}')"

          curl --fail-with-body -sS \
            -X POST "${BACKEND_URL}/api/crm/tick" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${API_SECRET_KEY}" \
            -H "x-timestamp: ${TIMESTAMP}" \
            -H "x-signature: ${SIGNATURE}" \
            -d "${BODY}"
